name: lumen
description: "GOG library manager, downloader and Proton launcher for Linux."
repository: https://github.com/fernando-navarrete/lumen
publish_to: "none"
version: 1.3.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  vector_math: ^2.2.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  dir_picker: ^0.4.1
  path: ^1.9.1
  gogdl_flutter:
    git:
      url: https://github.com/fernando-navarrete/gogdl_flutter.git
      ref: v1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
