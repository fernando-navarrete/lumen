# CI for lumen. Runs on the self-hosted runner on thinkcentre.home (Docker
# executor) — see devlog/v1.1.0-foundation.md Phase 0/8.
#
# `gogdl_flutter` is a private git dependency reachable only over the LAN
# (ssh://git@thinkcentre.home:2200). `pub get` authenticates with a read-only
# SSH deploy key stored base64-encoded (single line, no whitespace — GitLab's
# "File" variable type mangled the raw multi-line PEM on paste) as the
# `GOGDL_DEPLOY_KEY_B64` variable (Settings -> CI/CD -> Variables in this
# project, Type: Variable, masked); its public half must be added as a deploy
# key on the gogdl_flutter project.
#
# If a job fails to resolve thinkcentre.home, the runner's containers aren't
# seeing the LAN's /etc/hosts entry (it's a hosts-file entry, not real DNS).
# Fix it in /etc/gitlab-runner/config.toml under [runners.docker]:
#   extra_hosts = ["thinkcentre.home:192.168.8.234"]
# then restart the runner (`sudo gitlab-runner restart`).

# Pipelines run only for tag pushes (e.g. v1.2.0), not on every branch push,
# to keep load off the self-hosted runner. Tag a commit to run analyze + test.
workflow:
  rules:
    - if: $CI_COMMIT_TAG

stages:
  - check

# Jobs run in gogdl_flutter's prebuilt CI image: since gogdl_flutter v1.2.1 its
# native library is built by a Native Assets hook (hook/build.dart runs cargo)
# on every `flutter pub get`/`analyze`/`test`, so the job needs Flutter *and* the
# pinned Rust toolchain. Flutter (/opt/flutter) and Rust (/opt/cargo) are baked
# in; the image is built on the runner host from the gogdl_flutter repo
# (ci/build-image.sh). Bump the tag below whenever .fvmrc or the bridge's
# rust/rust-toolchain.toml changes, keeping it in step with the gogdl_flutter
# tag pinned in pubspec.yaml.
variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.ci/pub-cache"

.setup: &setup
  image:
    name: gogdl-flutter-ci:flutter-3.47.2-rust-1.98.1-frb-2.13.0
    pull_policy: if-not-present
  before_script:
    # SSH access to gogdl_flutter via the base64-encoded deploy key variable.
    - mkdir -p ~/.ssh
    - echo "$GOGDL_DEPLOY_KEY_B64" | base64 -d > ~/.ssh/gogdl_deploy_key
    - chmod 600 ~/.ssh/gogdl_deploy_key
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/gogdl_deploy_key
    - ssh-keyscan -p 2200 thinkcentre.home >> ~/.ssh/known_hosts 2>/dev/null
    # The Native Assets hook runs cargo with a scrubbed environment (only HOME
    # and PATH), so SSH_AUTH_SOCK never reaches it and cargo's built-in git
    # client can't use the agent to clone gogdl-lib. Give it file-based config
    # instead: the system git CLI reads ~/.ssh/config, and cargo is told to use it.
    - |
      cat > ~/.ssh/config <<EOF
      Host thinkcentre.home
        Port 2200
        User git
        IdentityFile ~/.ssh/gogdl_deploy_key
        IdentitiesOnly yes
      EOF
    - chmod 600 ~/.ssh/config
    - mkdir -p ~/.cargo
    - printf '[net]\ngit-fetch-with-cli = true\n' >> ~/.cargo/config.toml
    - flutter --version
    - flutter pub get
  cache:
    key:
      files:
        - .fvmrc
        - pubspec.lock
    paths:
      - .ci/pub-cache/
      - .dart_tool/hooks_runner/

analyze:
  stage: check
  <<: *setup
  script:
    - flutter analyze --fatal-infos

test:
  stage: check
  <<: *setup
  script:
    - flutter test
