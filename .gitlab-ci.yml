# CI for lumen. Runs on the self-hosted runner on thinkcentre.home (Docker executor) — see
# devlog/v1.1.0-foundation.md Phase 0/8. Pipelines run for merge requests and `v*` tags, never for a plain branch
# push or a push to main (main only receives a tree an MR pipeline already tested; see devlog/ci-cd-merge-requests.md).
#   lint:        tool/check_bridge_pin.sh first (the gogdl_flutter tag pinned in pubspec.lock is on its GitHub mirror at the
#                locked SHA), then the `dart format` check on lib, test and tool, then `flutter analyze --fatal-infos` (the rules are in
#                analysis_options.yaml). Before `pub get`, tool/check_lockfile.sh fails on a package in pubspec.lock
#                from outside pub.dev (or github.com/fernando-navarrete, the bridge), and `pub get --enforce-lockfile`
#                fails if pubspec.lock is stale or a package's hash changed.
#   test:        `flutter test`, same setup.
#   secrets:     gitleaks over git history with .gitleaks.toml (default rules, no allowlist): an MR's own commits, or on a
#                tag pipeline everything HEAD, the remote branches and the tags reach. Findings are redacted.
#   bridge-lock: reads the gogdl_flutter commit pinned in pubspec.lock, fetches it and keeps its rust/Cargo.lock, pruned
#                to the crates `cargo tree` resolves (tool/prune_cargo_lock.dart), as an artifact. Most of the code that
#                ships is that Rust, built by the Native Assets hook, so it is scanned too. The unpruned lockfile and the
#                crate list are kept beside it.
#   scan:        OSV-Scanner on pubspec.lock and the bridge's pruned Cargo.lock, minus the accepted findings in
#                osv-scanner.toml (each needs a reason and an ignoreUntil date). Only a scanner or network error fails it
#                here (exit codes above 1); the report is kept as an artifact.
#   scan-gate:   tool/osv_gate.dart reads that report: any vulnerability left fails the job, RUSTSEC informational
#                advisories (unmaintained, unsound, notice) are only printed. It is a separate job because this CI
#                image has dart but no jq, and the OSV image has neither.
#   Schedules:   one pipeline schedule (CI/CD -> Schedules, on main) with the variable SCHEDULE=scan runs only
#                bridge-lock, scan and scan-gate, weekly, so an advisory published after a dependency landed is
#                noticed. A second schedule with SCHEDULE=renovate runs only renovate. Any other schedule runs nothing.
#   renovate:    only on the SCHEDULE=renovate schedule. Opens one grouped minor/patch dependency MR per renovate.json.
#                RENOVATE_TOKEN (a masked project access token with api + write_repository, role Developer) and
#                GITHUB_COM_TOKEN (a no-permission fine-grained GitHub token, for release lookups) are protected
#                variables scoped to the `renovate` environment, so no other job sees them. Renovate exits 0 even when it
#                gives up on the repository, so the job also fails on "Temporary error" or an error result in its log.
#   package:     tool/build_appimage.sh in the CI image: Lumen-<version>-x86_64.AppImage and its .sha256, kept as artifacts.
#                Automatic on `v*` tags, manual on MRs (play it once to prove the build; it never blocks the MR).
#   publish:     `v*` tags only (vX.Y.Z), after lint, test, secrets, scan-gate and package. Fails unless the tag is on
#                main and tool/release_notes.sh passes (pubspec.yaml version == tag, CHANGELOG.md has `## X.Y.Z`),
#                then uploads the AppImage and checksum to the project's generic package registry (CI_JOB_TOKEN).
#   release:     creates the GitLab release for the tag from the CHANGELOG section, linking the two uploaded files.
#   Branches:    main is protected: no pushes, every change is an MR whose pipeline must pass (SECURITY.md).
#
# `gogdl_flutter` is a git dependency fetched from its public GitHub mirror over HTTPS
# (https://github.com/fernando-navarrete/gogdl_flutter), and so is its `gogdl-lib`: no key, no ssh and no git CLI
# setting, so CI proves that a clone builds anywhere.
#
# The runner still needs thinkcentre.home to reach GitLab itself. If a job fails to resolve it, the runner's
# containers aren't seeing the LAN's /etc/hosts entry (it's a hosts-file entry, not real DNS).
# Fix it in /etc/gitlab-runner/config.toml under [runners.docker]:
#   extra_hosts = ["thinkcentre.home:192.168.8.234"]
# then restart the runner (`sudo gitlab-runner restart`).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # the MR pipeline covers it: no duplicate branch pipeline
    - if: $CI_COMMIT_TAG =~ /^v/

stages:
  - lint
  - test
  - scan
  - package
  - release

default:
  interruptible: true # with "Auto-cancel redundant pipelines" on, a new push cancels the older run

variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.ci/pub-cache"

# Jobs run in gogdl_flutter's prebuilt CI image: since gogdl_flutter v1.2.1 its
# native library is built by a Native Assets hook (hook/build.dart runs cargo)
# on every `flutter pub get`/`analyze`/`test`, so the job needs Flutter *and* the
# pinned Rust toolchain. Flutter (/opt/flutter) and Rust (/opt/cargo) are baked
# in; the image is built on the runner host from the gogdl_flutter repo
# (ci/build-image.sh), so it is in no registry and can't be digest-pinned. Bump
# the tag below whenever .fvmrc or the bridge's rust/rust-toolchain.toml
# changes, keeping it in step with the gogdl_flutter tag pinned in pubspec.yaml.
.ci-image:
  image:
    name: gogdl-flutter-ci:flutter-3.47.2-rust-1.98.1-frb-2.13.0-r4
    pull_policy: if-not-present

.flutter:
  extends: .ci-image
  before_script:
    - sh tool/check_lockfile.sh # before pub get, so nothing outside pub.dev and the bridge's mirror is ever fetched
    - flutter --version
    - flutter pub get --enforce-lockfile
  cache:
    key:
      files:
        - .fvmrc
        - pubspec.lock
    paths:
      - .ci/pub-cache/
      - .dart_tool/hooks_runner/

.not-on-schedule:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

# The scan jobs also run on the weekly SCHEDULE=scan pipeline, and nothing else does.
.scan-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "scan"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

lint:
  stage: lint
  extends: .flutter
  before_script:
    - sh tool/check_bridge_pin.sh # cheap, reads github.com only: the pinned bridge tag is on the mirror at the locked SHA
    - !reference [.flutter, before_script]
  rules: !reference [.not-on-schedule, rules]
  script:
    # Cheap first; `dart format lib test tool` fixes it, the analyzer needs a code change.
    - dart format --output=none --set-exit-if-changed lib test tool
    - flutter analyze --fatal-infos

test:
  stage: test
  extends: .flutter
  rules: !reference [.not-on-schedule, rules]
  script:
    - flutter test

# The AppImage. Needs libsecret-1-dev, which the image has since r4. build_appimage.sh downloads appimagetool and the
# runtime, pinned by sha256 and refused on a mismatch; build/appimage-tools/ is only a cache of those.
package:
  stage: package
  extends: .flutter
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true # a manual job that was never played must not leave the MR pipeline blocked
  cache:
    - key:
        files:
          - .fvmrc
          - pubspec.lock
      paths:
        - .ci/pub-cache/
        - .dart_tool/hooks_runner/
    - key: appimage-tools
      paths:
        - build/appimage-tools/
  script:
    - FLUTTER=flutter bash tool/build_appimage.sh
  artifacts:
    expire_in: 30 days
    paths:
      - build/appimage/Lumen-*-x86_64.AppImage
      - build/appimage/Lumen-*-x86_64.AppImage.sha256

.release-tag-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# The GitLab host uses a private CA the images don't trust. The runner hands it to jobs as CI_SERVER_TLS_CA_FILE
# when its config.toml has tls-ca-file; add it to the trust store (git, curl and Go read this bundle).
.private-ca:
  script:
    - |
      if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then
        cat "$CI_SERVER_TLS_CA_FILE" >> /etc/ssl/certs/ca-certificates.crt
      else
        echo "warning: CI_SERVER_TLS_CA_FILE is not set; requests to GitLab will fail on the private CA unless the runner provides it" >&2
      fi

# Every check runs before anything is uploaded, so a bad tag publishes nothing.
publish:
  stage: release
  extends: .ci-image
  rules: !reference [.release-tag-rules, rules]
  needs:
    - { job: lint, artifacts: false }
    - { job: test, artifacts: false }
    - { job: secrets, artifacts: false }
    - { job: scan-gate, artifacts: false }
    - { job: package, artifacts: true }
  variables:
    GIT_DEPTH: 0 # the ancestry check needs history
  cache: []
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - !reference [.private-ca, script]
    - git fetch origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
    - |
      git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH" || {
        echo "$CI_COMMIT_TAG points at $CI_COMMIT_SHA, which is not on $CI_DEFAULT_BRANCH: tag the merged release commit" >&2
        exit 1
      }
    - sh tool/release_notes.sh "$CI_COMMIT_TAG" > release_notes.md
    - cat release_notes.md
    - |
      version="${CI_COMMIT_TAG#v}"
      base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/lumen/$version"
      cd build/appimage
      test "$(ls Lumen-*-x86_64.AppImage | wc -l)" = 1 || { echo "expected exactly one AppImage" >&2; exit 1; }
      file=$(ls Lumen-*-x86_64.AppImage)
      [ "$file" = "Lumen-$version-x86_64.AppImage" ] || { echo "built $file, expected Lumen-$version-x86_64.AppImage" >&2; exit 1; }
      sha256sum -c "$file.sha256"
      for f in "$file" "$file.sha256"; do
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$base/$f"
      done
      cd ../..
      {
        echo "APPIMAGE_FILE=$file"
        echo "APPIMAGE_URL=$base/$file"
        echo "SHA256_URL=$base/$file.sha256"
      } > release.env
  artifacts:
    expire_in: 30 days
    paths: [release_notes.md]
    reports:
      dotenv: release.env

release:
  stage: release
  image:
    name: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
    pull_policy: if-not-present
  rules: !reference [.release-tag-rules, rules]
  needs:
    - { job: publish, artifacts: true }
  cache: []
  script:
    - !reference [.private-ca, script]
    - echo "Releasing $CI_COMMIT_TAG with $APPIMAGE_FILE"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release_notes.md
    assets:
      links:
        - name: $APPIMAGE_FILE
          url: $APPIMAGE_URL
          link_type: package
        - name: $APPIMAGE_FILE.sha256
          url: $SHA256_URL
          link_type: other

# On an MR it scans only the MR's commits; on tags, what HEAD, the remote branches and the tags reach
# (GIT_DEPTH 0: the diff base and the full scan both need every commit). Not `--all`: that also walks
# GitLab's hidden refs/merge-requests/* and refs/pipelines/*, which outlive a closed MR. Findings are
# redacted, so the report is safe to keep. Not scheduled: the image is pinned, so a weekly rerun would
# find nothing new.
secrets:
  stage: lint
  rules: !reference [.not-on-schedule, rules]
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [''] # the binary is gitleaks, on PATH
    pull_policy: if-not-present
  variables:
    GIT_DEPTH: 0
  cache: []
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      range=""
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then range="$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"; else range="HEAD --remotes --tags"; fi
      gitleaks git . --config .gitleaks.toml --log-opts="$range" --redact --no-banner --exit-code 1 --report-format json --report-path gitleaks.json
  artifacts:
    when: always
    expire_in: 30 days
    paths: [gitleaks.json]

bridge-lock:
  stage: scan
  extends: .ci-image
  rules: !reference [.scan-rules, rules]
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.ci/cargo" # only the download caches move; the toolchain stays in the image
  cache:
    key:
      prefix: cargo
      files:
        - pubspec.lock # a new bridge pin is the only thing that changes the crates
    paths:
      - .ci/cargo/registry/
      - .ci/cargo/git/
  script:
    # The bridge's tree at the exact commit pubspec.lock pins, fetched from its GitHub mirror over HTTPS
    # (no pub get). `cargo tree` needs its manifests, not just the lockfile.
    - |
      ref=$(awk '/^  gogdl_flutter:/{f=1} f&&/resolved-ref:/{gsub(/"/, "", $2); print $2; exit}' pubspec.lock)
      url=$(awk '/^  gogdl_flutter:/{f=1} f&&/^      url:/{gsub(/"/, "", $2); print $2; exit}' pubspec.lock)
      [ -n "$ref" ] && [ -n "$url" ] || { echo "gogdl_flutter's resolved-ref/url not found in pubspec.lock"; exit 1; }
      echo "gogdl_flutter $ref"
    - git init -q bridge-src
    - git -C bridge-src fetch --depth 1 "$url" "$ref"
    - git -C bridge-src checkout -q FETCH_HEAD
    # Cargo.lock also lists optional crates that no enabled feature builds (reqwest's weak `quinn?/...` feature keeps
    # quinn-proto there), and OSV-Scanner reads the lockfile as text. So `scan` gets the lockfile pruned to the crates
    # Cargo resolves (every target, all of the bridge's features, dev and build dependencies). A crate that joins the
    # build graph later is in `cargo tree`, so it stays in the file and is scanned: no ignore list to keep honest.
    - mkdir bridge
    - cp bridge-src/rust/Cargo.lock bridge/Cargo.full.lock
    - cd bridge-src/rust && rustc --version && cargo tree --locked --target all --all-features -e normal,build,dev --prefix none --format '{p}' > ../../bridge/cargo-tree.txt && cd ../..
    - dart tool/prune_cargo_lock.dart bridge/Cargo.full.lock bridge/cargo-tree.txt bridge/Cargo.lock # the name OSV-Scanner recognizes
  artifacts:
    expire_in: 30 days
    paths:
      - bridge/Cargo.lock
      - bridge/Cargo.full.lock
      - bridge/cargo-tree.txt

scan:
  stage: scan
  rules: !reference [.scan-rules, rules]
  needs: [bridge-lock]
  image:
    name: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
    entrypoint: [''] # the binary is /osv-scanner, not on PATH; the image has /bin/sh
  cache: []
  script:
    - |
      rc=0
      /osv-scanner scan --config osv-scanner.toml --lockfile pubspec.lock --lockfile bridge/Cargo.lock \
        --format json --output-file osv-scanner.json || rc=$?
      # 0 = clean, 1 = findings (judged by scan-gate). Anything else is a scanner or network error, which must not pass.
      [ "$rc" -le 1 ] || exit "$rc"
      grep -o '"\(RUSTSEC\|GHSA\|CVE\|MAL\|PYSEC\)-[^"]*"' osv-scanner.json | sort -u || true # what OSV found, for the log
  artifacts:
    when: always
    expire_in: 30 days
    paths: [osv-scanner.json]

scan-gate:
  stage: scan
  extends: .ci-image
  rules: !reference [.scan-rules, rules]
  needs: [scan]
  cache: []
  script:
    - dart tool/osv_gate.dart osv-scanner.json # reads only the artifact: no pub get

renovate:
  stage: scan
  image: renovate/renovate:44@sha256:05c512c35c764ef6a179e69c3b30567eca254d67f13a0143479fe3c84852c67a
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "renovate"
  # Variables scoped to the `renovate` environment reach only this job. `access` records no deployment.
  environment:
    name: renovate
    action: access
  cache: []
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: 'false'
    RENOVATE_REQUIRE_CONFIG: required
    LOG_LEVEL: info
  script:
    # thinkcentre.home uses a private CA: the runner's tls-ca-file covers Node (Renovate) and git (for that host only).
    - '[ -n "$RENOVATE_TOKEN" ] || { echo "RENOVATE_TOKEN is not set (protected, environment scope renovate)"; exit 1; }'
    - |
      if [ -n "$CI_SERVER_TLS_CA_FILE" ]; then
        export NODE_EXTRA_CA_CERTS="$CI_SERVER_TLS_CA_FILE"
        # Scoped to the GitLab host: GIT_SSL_CAINFO would replace git's CA bundle for every host, and `pub upgrade`
        # now fetches gogdl_flutter from github.com over HTTPS.
        git config --global "http.$CI_SERVER_URL/.sslCAInfo" "$CI_SERVER_TLS_CA_FILE"
      fi
      { renovate 2>&1; echo $? > renovate.rc; } | tee renovate.log
      # Renovate exits 0 when it gives up on a repository (e.g. "Temporary error - aborting" for a token without
      # Developer access), so judge the log too: a run that did not finish its repository must not look green.
      [ "$(cat renovate.rc)" = 0 ] || { echo "renovate exited $(cat renovate.rc)"; exit 1; }
      ! grep -Eq 'Temporary error|"result": "[a-z-]*error"|"exitCode": [1-9]' renovate.log \
        || { echo "renovate did not complete its repository (see the log above)"; exit 1; }
